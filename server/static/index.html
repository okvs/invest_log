<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e9efe9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1411" media="(prefers-color-scheme: dark)">
<title>투자 기록</title>
<style>
  :root{
    --bg:#e9efe9; --card:#fff; --text:#1f2a24; --strong:#0f1f17; --dim:#6b7a70;
    --border:#d4ddd7; --accent:#1f7a52; --soft:#d3e6da; --profit:#15924a; --loss:#d83c3c;
    --shadow:0 2px 14px rgba(31,80,55,.10);
  }
  @media (prefers-color-scheme: dark){:root{
    --bg:#0d1411; --card:#152019; --text:#d6e0d9; --strong:#f0f5f1; --dim:#7d8c83;
    --border:#243029; --accent:#3cc488; --soft:#1c3026; --profit:#22c55e; --loss:#f87171;
    --shadow:0 2px 14px rgba(0,0,0,.45);
  }}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);
       padding:18px 16px calc(96px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
  h1{font-size:20px;color:var(--strong);font-weight:800}
  .muted{color:var(--dim)} .profit{color:var(--profit)} .loss{color:var(--loss)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
  .row{display:flex;gap:10px;align-items:center}
  label{display:block;font-size:12px;color:var(--dim);font-weight:600;margin:10px 0 4px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;
       background:var(--bg);color:var(--text);font-size:15px;font-family:inherit}
  textarea{min-height:64px;resize:vertical}
  button{font-family:inherit;cursor:pointer}
  .btn{width:100%;padding:13px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;margin-top:14px}
  .btn.sec{background:var(--soft);color:var(--accent)}
  .btn:active{opacity:.85}
  .seg{display:flex;gap:6px;margin-bottom:12px}
  .seg button{flex:1;padding:9px;border:1px solid var(--border);background:var(--card);color:var(--dim);border-radius:10px;font-weight:700;font-size:13px}
  .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:8px 6px;border-bottom:1px solid var(--border);text-align:right}
  td:first-child,th:first-child{text-align:left}
  th{color:var(--dim);font-size:11px;font-weight:700}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--accent)}
  .toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
       background:var(--strong);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;
       box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;z-index:2000;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:1000;padding:0 12px calc(12px + env(safe-area-inset-bottom))}
  .tabbar nav{display:flex;gap:4px;padding:8px;background:var(--card);border:1px solid var(--border);
       border-radius:22px;box-shadow:var(--shadow);max-width:520px;margin:0 auto}
  .tabbar button{flex:1;background:none;border:none;color:var(--dim);font-size:12px;font-weight:700;padding:9px 4px;border-radius:14px}
  .tabbar button.on{background:var(--soft);color:var(--accent)}
  #login{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
  #gbtn{display:flex;align-items:center;gap:10px;padding:12px 22px;border:1px solid var(--border);border-radius:12px;
       background:var(--card);color:var(--text);font-size:15px;font-weight:700;box-shadow:var(--shadow)}
  .hide{display:none}
  .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .small{font-size:12px}
  .page{max-width:560px;margin:0 auto}
</style>
</head>
<body>
<div class="page">
  <!-- 로그인 -->
  <div id="login">
    <h1>📈 투자 기록</h1>
    <div class="muted small">허용된 계정으로 로그인하세요</div>
    <button id="gbtn">🔑 구글로 로그인</button>
    <div id="loginerr" class="loss small"></div>
  </div>

  <!-- 앱 -->
  <div id="app" class="hide">
    <div class="hd">
      <h1 id="title">현황</h1>
      <button class="tag" id="logout" style="border:none">로그아웃</button>
    </div>

    <!-- 현황 -->
    <section id="pg-status" class="page-sec">
      <div class="card" id="summary"><div class="muted">불러오는 중…</div></div>
      <div class="card">
        <div class="muted small" style="margin-bottom:8px">보유 종목</div>
        <table id="holdings"><tbody></tbody></table>
      </div>
    </section>

    <!-- 매수/매도 -->
    <section id="pg-trade" class="page-sec hide">
      <div class="seg">
        <button id="seg-buy" class="on" onclick="setSide('buy')">매수</button>
        <button id="seg-sell" onclick="setSide('sell')">매도</button>
      </div>
      <div class="card">
        <div id="buyfields">
          <label>종목명</label><input id="b_name" placeholder="예: 삼성전자">
          <label>섹터</label><input id="b_sector" placeholder="예: 반도체">
          <div class="row"><div style="flex:1"><label>수량(주)</label><input id="b_qty" type="number" inputmode="numeric"></div>
            <div style="flex:1"><label>단가(원)</label><input id="b_price" type="number" inputmode="numeric"></div></div>
          <label>매수 근거</label><textarea id="b_thesis" placeholder="왜 샀는지"></textarea>
          <label>자금 (증거금률 %)</label>
          <select id="b_margin"><option value="100">현금 100%</option><option value="40">신용 40%</option>
            <option value="50">50%</option><option value="60">60%</option><option value="0">전액 신용</option></select>
          <button class="btn" onclick="submitBuy()">매수 기록</button>
        </div>
        <div id="sellfields" class="hide">
          <label>종목</label><select id="s_name"></select>
          <div class="row"><div style="flex:1"><label>수량(주)</label><input id="s_qty" type="number" inputmode="numeric"></div>
            <div style="flex:1"><label>매도가(원)</label><input id="s_price" type="number" inputmode="numeric"></div></div>
          <label>매도 사유</label><textarea id="s_reason" placeholder="왜 팔았는지"></textarea>
          <button class="btn" onclick="submitSell()">매도 기록</button>
        </div>
      </div>
    </section>

    <!-- 회고 -->
    <section id="pg-retro" class="page-sec hide">
      <div class="card"><div class="muted small">회고 대기 (미회고 매도)</div>
        <div id="retrolist" style="margin-top:8px"></div></div>
      <div class="card hide" id="retroform">
        <div class="hd"><b id="r_title"></b><button class="tag" style="border:none" onclick="closeRetro()">닫기</button></div>
        <label>매수 근거가 맞았나?</label>
        <select id="r_correct"><option value="">(부분적/모름)</option><option value="true">맞았다</option><option value="false">틀렸다</option></select>
        <label>잘한 점</label><textarea id="r_well"></textarea>
        <label>아쉬운 점</label><textarea id="r_regret"></textarea>
        <label>피할 수 있었나</label><input id="r_avoid" placeholder="피할 수 있었다 / 통제 불가 / 모르겠다">
        <label>교훈</label><textarea id="r_lesson"></textarea>
        <button class="btn" onclick="submitRetro()">회고 저장</button>
      </div>
    </section>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="tabbar hide" id="tabbar"><nav>
  <button class="on" onclick="go('status')">📊 현황</button>
  <button onclick="go('trade')">💱 매매</button>
  <button onclick="go('retro')">📝 회고</button>
</nav></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBXM3CClPOh2AJXhkeCXukHcPXQA1v6w4s",
  authDomain: "invest-log-caf3d.firebaseapp.com",
  projectId: "invest-log-caf3d",
  storageBucket: "invest-log-caf3d.firebasestorage.app",
  messagingSenderId: "1006342123333",
  appId: "1:1006342123333:web:34860e03bc34a420b8582c",
  measurementId: "G-PE54PXP40C"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
let STATE = null;

function toast(msg, bad){const t=document.getElementById('toast');t.textContent=msg;
  t.style.background=bad?'var(--loss)':'var(--strong)';t.style.color=bad?'#fff':'var(--bg)';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}

async function api(path, method='GET', body){
  const tok = await auth.currentUser.getIdToken();
  const r = await fetch(path,{method,headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},
    body:body?JSON.stringify(body):undefined});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.detail||('오류 '+r.status));
  return j;
}

// --- 로그인 ---
document.getElementById('gbtn').onclick = async ()=>{
  try{ await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  catch(e){
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'||e.code==='auth/cancelled-popup-request')
      auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
    else document.getElementById('loginerr').textContent = e.message;
  }
};
document.getElementById('logout').onclick = ()=>auth.signOut();

auth.onAuthStateChanged(async user=>{
  if(user){
    document.getElementById('login').classList.add('hide');
    document.getElementById('app').classList.remove('hide');
    document.getElementById('tabbar').classList.remove('hide');
    await refresh();
  }else{
    document.getElementById('login').classList.remove('hide');
    document.getElementById('app').classList.add('hide');
    document.getElementById('tabbar').classList.add('hide');
  }
});

// --- 데이터 로드/렌더 ---
function won(n){return (Math.round(n)).toLocaleString('ko-KR');}
async function refresh(){
  try{ STATE = await api('/api/state'); }
  catch(e){ toast(e.message,true); if((''+e.message).includes('403')) document.getElementById('loginerr').textContent='허용되지 않은 계정'; return; }
  renderSummary(); renderHoldings(); fillSellSelect(); renderRetroList();
}
function renderSummary(){
  const a=STATE.account||{}; const n=(STATE.holdings||[]).length;
  document.getElementById('summary').innerHTML =
    `<div class="row" style="justify-content:space-between"><span class="muted">현금 예수금</span><b>${won(a.cash||0)}원</b></div>`+
    (a.futures_cash!=null?`<div class="row" style="justify-content:space-between;margin-top:6px"><span class="muted">선물 가용</span><b>${won(a.futures_cash)}원</b></div>`:'')+
    `<div class="row" style="justify-content:space-between;margin-top:6px"><span class="muted">보유 종목</span><b>${n}종목</b></div>`;
}
function renderHoldings(){
  const rows=(STATE.holdings||[]).map(h=>`<tr><td>${h.name}</td><td>${(h.quantity||0).toLocaleString()}</td><td>${won(h.avg_price||0)}</td></tr>`).join('');
  document.getElementById('holdings').innerHTML = `<thead><tr><th>종목</th><th>수량</th><th>평단</th></tr></thead><tbody>${rows||'<tr><td colspan=3 class="muted">보유 없음</td></tr>'}</tbody>`;
}
function fillSellSelect(){
  document.getElementById('s_name').innerHTML = (STATE.holdings||[]).map(h=>`<option>${h.name}</option>`).join('');
}
function renderRetroList(){
  const list=STATE.unreviewed_sells||[];
  document.getElementById('retrolist').innerHTML = list.length? list.map(t=>{
    const pnl=t.profit_loss||0, cls=pnl>=0?'profit':'loss', sign=pnl>=0?'+':'';
    return `<div class="row" style="justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)">
      <div><b>${t.name}</b><div class="muted small">${(t.date||'').slice(0,10)} · ${t.quantity}주</div></div>
      <div style="text-align:right"><span class="${cls}">${sign}${won(pnl)}원</span>
        <div><button class="tag" style="border:none;margin-top:4px" onclick='openRetro(${JSON.stringify(t.id)},${JSON.stringify(t.name)})'>회고 ›</button></div></div></div>`;
  }).join('') : '<div class="muted small">회고할 매도가 없습니다 👍</div>';
}

// --- 탭 ---
function go(p){
  ['status','trade','retro'].forEach(x=>document.getElementById('pg-'+x).classList.toggle('hide',x!==p));
  document.querySelectorAll('.tabbar button').forEach((b,i)=>b.classList.toggle('on',['status','trade','retro'][i]===p));
  document.getElementById('title').textContent={status:'현황',trade:'매매',retro:'회고'}[p];
  window.scrollTo(0,0);
}
function setSide(s){
  document.getElementById('buyfields').classList.toggle('hide',s!=='buy');
  document.getElementById('sellfields').classList.toggle('hide',s!=='sell');
  document.getElementById('seg-buy').classList.toggle('on',s==='buy');
  document.getElementById('seg-sell').classList.toggle('on',s==='sell');
}

// --- 액션 ---
async function submitBuy(){
  const name=v('b_name'), qty=+v('b_qty'), price=+v('b_price');
  if(!name||!qty||!price){toast('종목·수량·단가를 입력하세요',true);return;}
  try{ await api('/api/buy','POST',{name,quantity:qty,price,sector:v('b_sector'),thesis:v('b_thesis'),margin_ratio:+v('b_margin')});
    toast('매수 기록 완료'); ['b_name','b_sector','b_qty','b_price','b_thesis'].forEach(id=>document.getElementById(id).value=''); await refresh();
  }catch(e){toast(e.message,true);}
}
async function submitSell(){
  const name=v('s_name'), qty=+v('s_qty'), price=+v('s_price');
  if(!name||!qty||!price){toast('종목·수량·단가를 입력하세요',true);return;}
  try{ await api('/api/sell','POST',{name,quantity:qty,price,reason:v('s_reason')});
    toast('매도 기록 완료'); ['s_qty','s_price','s_reason'].forEach(id=>document.getElementById(id).value=''); await refresh();
  }catch(e){toast(e.message,true);}
}
let retroId=null;
function openRetro(id,name){retroId=id;document.getElementById('r_title').textContent=name+' 회고';
  document.getElementById('retroform').classList.remove('hide');
  ['r_well','r_regret','r_avoid','r_lesson'].forEach(i=>document.getElementById(i).value='');document.getElementById('r_correct').value='';
  document.getElementById('retroform').scrollIntoView({behavior:'smooth'});}
function closeRetro(){document.getElementById('retroform').classList.add('hide');retroId=null;}
async function submitRetro(){
  if(!retroId)return; const tc=v('r_correct');
  try{ await api('/api/retro','POST',{transaction_id:retroId,
      thesis_correct: tc===''?null:(tc==='true'),
      what_went_well:v('r_well'),regrets:v('r_regret'),avoidable:v('r_avoid'),lessons:v('r_lesson')});
    toast('회고 저장 완료'); closeRetro(); await refresh();
  }catch(e){toast(e.message,true);}
}
function v(id){return document.getElementById(id).value.trim();}

// redirect 로그인 결과 처리
auth.getRedirectResult().catch(e=>{document.getElementById('loginerr').textContent=e.message;});
</script>
</body>
</html>
