# 매도 후 별도 명령어로 회고 작성 시나리오.
# 이전에는 매도 직후에 "회고를 진행할까요?" 가 떴지만, 지금은 매도가 즉시 종료되고
# 사용자가 '회고' 명령어를 입력해야 미회고 매도를 카드로 보여준다.

name: "매도 → 회고 카드 표시"
description: |
  매도 직후 회고 흐름이 끼어들지 않고 종료되는지, 그리고 '회고' 명령어로
  최근 매도 거래가 카드로 노출되는지 확인.

setup:
  ticker_map:
    삼성전자: "005930.KS"
  holdings:
    - name: "삼성전자"
      ticker: "005930.KS"
      sector: "반도체"
      quantity: 10
      avg_price: 72000
      buy_thesis: "AI 수요 증가"

steps:
  # 1. 매도 시작
  - send: "매도"
    expect: "매도할 종목을 선택해주세요"

  # 2. 종목 선택
  - click: "sell_select:삼성전자"
    expect: "수량 / 매도가 / 사유"

  # 3. 매도 정보 입력 → 즉시 종료, 회고 안내 문구 포함
  - send: |
      5
      85000
      목표가 도달
    expect:
      - "매도 기록 완료!"
      - "회고하려면 '회고' 를 입력해주세요"
    not_expect: "이 매도에 대해 회고를 진행할까요?"

  # 4. '회고' 명령어 → 최근 미회고 매도 카드 표시
  - send: "회고"
    expect:
      - "회고할 매도를 선택해주세요"
      - "삼성전자"
